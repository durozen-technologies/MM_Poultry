name: Build Android Release AAB

on:
  workflow_dispatch: # Allows manual trigger from the Actions tab

jobs:
  build:
    name: Build & Sign Android Release Bundle (AAB)
    runs-on: ubuntu-latest
    env:
      EXPO_PUBLIC_API_URL: ${{ secrets.EXPO_PUBLIC_API_BASE_URL }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Setup Bun
        uses: oven-sh/setup-bun@v1
        with:
          bun-version: latest

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Setup Java
        uses: actions/setup-java@v5
        with:
          distribution: 'temurin'
          java-version: '17'
          cache: 'gradle'

      - name: Install Frontend Dependencies
        working-directory: ./frontend
        run: bun install

      - name: Expo Prebuild
        working-directory: ./frontend
        run: npx expo prebuild --platform android --clean

      - name: Decode Keystore
        working-directory: ./frontend/android/app
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          echo $ANDROID_KEYSTORE_BASE64 | base64 --decode > release.keystore

      - name: Configure Release Signing in build.gradle
        working-directory: ./frontend/android/app
        run: |
          cat << 'EOF' > patch_gradle.py
          with open('build.gradle', 'r') as f:
              content = f.read()
          
          signing_block = """signingConfigs {
              release {
                  storeFile file("release.keystore")
                  storePassword System.getenv("ANDROID_KEYSTORE_PASSWORD")
                  keyAlias System.getenv("ANDROID_KEY_ALIAS")
                  keyPassword System.getenv("ANDROID_KEY_PASSWORD")
              }
          """
          content = content.replace("signingConfigs {", signing_block)
          content = content.replace("signingConfig signingConfigs.debug", "signingConfig signingConfigs.release")
          
          with open('build.gradle', 'w') as f:
              f.write(content)
          EOF
          python3 patch_gradle.py

      - name: Build Release AAB with Gradle
        working-directory: ./frontend/android
        env:
          NODE_OPTIONS: "--max-old-space-size=4096"
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          echo "" >> gradle.properties
          echo "org.gradle.jvmargs=-Xmx4096m -XX:MaxMetaspaceSize=1024m -XX:+HeapDumpOnOutOfMemoryError -Dfile.encoding=UTF-8" >> gradle.properties
          echo "org.gradle.workers.max=2" >> gradle.properties
          chmod +x gradlew
          ./gradlew :app:bundleRelease --no-daemon --stacktrace

      - name: Upload Signed AAB Artifact
        uses: actions/upload-artifact@v4
        with:
          name: MM-Poultry-PlayStore-Release-AAB
          path: frontend/android/app/build/outputs/bundle/release/app-release.aab
          retention-days: 7
