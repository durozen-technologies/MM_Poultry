name: Build Debug APK (Development)

# Local Gradle debug APK (no EAS). Prefer manual runs per .core/RULES.md.
# Dev-client APK loads JS from Metro; leave API URL empty so laptop frontend/.env is used at run time.
on:
  workflow_dispatch:
    inputs:
      api_base_url:
        description: Optional bake-in only. Leave blank to use laptop frontend/.env via Metro (recommended).
        type: string
        required: false
  push:
    branches:
      - main
      - master
      - dev
    paths:
      - "frontend/**"
      - ".github/workflows/apk-debug.yml"

concurrency:
  group: apk-debug-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  NODE_VERSION: "22"
  JAVA_VERSION: "17"
  GRADLE_OPTS: -Dorg.gradle.daemon=false -Xmx4096m
  APK_OUTPUT: frontend/android/app/build/outputs/apk/debug/app-debug.apk

jobs:
  build-debug-apk:
    name: Debug APK (${{ github.ref_name }})
    runs-on: ubuntu-latest
    timeout-minutes: 90
    defaults:
      run:
        working-directory: frontend

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Resolve API base URL (optional)
        id: config
        working-directory: .
        env:
          SECRET_API_URL: ${{ secrets.EXPO_PUBLIC_API_BASE_URL }}
          INPUT_API_URL: ${{ github.event.inputs.api_base_url }}
        run: |
          if [[ -n "${INPUT_API_URL:-}" ]]; then
            API_URL="$INPUT_API_URL"
            SOURCE="workflow input"
          elif [[ -n "${SECRET_API_URL:-}" ]]; then
            API_URL="$SECRET_API_URL"
            SOURCE="repository secret"
          else
            # Debug/dev-client: do not bake a CI default. Metro + laptop frontend/.env supplies the URL.
            API_URL=""
            SOURCE="none (use laptop frontend/.env with Metro)"
            echo "No API URL input/secret — building native shell only; set EXPO_PUBLIC_API_BASE_URL in laptop frontend/.env"
          fi
          if [[ -n "$API_URL" && ! "$API_URL" =~ ^https?:// ]]; then
            echo "API base URL must start with http:// or https://" >&2
            exit 1
          fi
          if [[ -n "$API_URL" ]]; then
            echo "EXPO_PUBLIC_API_BASE_URL=$API_URL" >> "$GITHUB_ENV"
          fi
          echo "api_url=${API_URL:-"(laptop .env / Metro)"}" >> "$GITHUB_OUTPUT"
          echo "api_source=$SOURCE" >> "$GITHUB_OUTPUT"

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install frontend dependencies
        run: npm ci

      - name: Set up JDK
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: ${{ env.JAVA_VERSION }}

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Cache Gradle
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: gradle-${{ runner.os }}-${{ hashFiles('frontend/package-lock.json', 'frontend/app.json') }}
          restore-keys: |
            gradle-${{ runner.os }}-

      - name: Prebuild + assembleDebug
        run: |
          chmod +x ./scripts/build-debug-apk.sh
          npm run build:debug-apk

      - name: Verify APK output
        working-directory: .
        run: |
          APK="${{ env.APK_OUTPUT }}"
          if [[ ! -f "$APK" ]]; then
            echo "APK not found at $APK" >&2
            find frontend/android/app/build/outputs -type f -name '*.apk' 2>/dev/null || true
            exit 1
          fi
          ls -lh "$APK"

      - name: Upload debug APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: mmbroilers-debug-${{ github.ref_name }}-${{ github.run_number }}
          path: ${{ env.APK_OUTPUT }}
          if-no-files-found: error
          retention-days: 30

      - name: Build summary
        if: success()
        working-directory: .
        run: |
          {
            echo "## Development debug APK"
            echo ""
            echo "| Field | Value |"
            echo "|-------|-------|"
            echo "| Branch | \`${{ github.ref_name }}\` |"
            echo "| Commit | \`${{ github.sha }}\` |"
            echo "| Variant | \`assembleDebug\` |"
            echo "| API URL | \`${{ steps.config.outputs.api_url }}\` |"
            echo "| API source | \`${{ steps.config.outputs.api_source }}\` |"
            echo "| APK size | $(du -h "${{ env.APK_OUTPUT }}" | cut -f1) |"
            echo ""
            echo "Download **mmbroliers-debug-*** from **Artifacts**, install on device."
            echo "Keep \`EXPO_PUBLIC_API_BASE_URL\` in laptop \`frontend/.env\`, then run \`npm run start:dev\`."
          } >> "$GITHUB_STEP_SUMMARY"
