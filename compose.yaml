services:
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    env_file: 
      - .env
    environment:
      - POSTGRES_SERVER=db
    depends_on:
      db:
        condition: service_healthy
    working_dir: /app
    restart: unless-stopped
    command: bash -c "cd /app && alembic -c alembic.ini upgrade head && uvicorn main:app --host 0.0.0.0 --port 8000"

  db:
    image: postgres:16-alpine
    restart: unless-stopped
    env_file:
      - .env
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-postgres} -d ${POSTGRES_DB:-MM_Poultry}"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  pgdata:
